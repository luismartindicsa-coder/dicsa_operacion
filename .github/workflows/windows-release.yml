name: Windows Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest

    env:
      UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/version.json
      DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest/download/DicsaOperacionSetup.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app version
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          if (-not $match) {
            throw "No se encontro la version en pubspec.yaml"
          }

          $version = $match.Matches[0].Groups[1].Value.Trim()
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows app
        run: >
          flutter build windows --release
          --dart-define=DICSA_UPDATE_MANIFEST_URL=${{ env.UPDATE_MANIFEST_URL }}

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            throw "No se encontro Inno Setup en el runner: $compiler"
          }
          & $compiler "/DMyAppVersion=$env:APP_VERSION" "/DFlutterBuildDir=$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release" "installer/dicsa_operacion.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup fallo con codigo $LASTEXITCODE"
          }

      - name: Create update manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\installer | Out-Null
          $publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = @{
            version = "${{ env.APP_VERSION }}"
            notes = "Consulta las notas del release en GitHub."
            windows_url = "${{ env.DOWNLOAD_URL }}"
            published_at = $publishedAt
          } | ConvertTo-Json

          Set-Content -Path build\installer\version.json -Value $manifest -Encoding utf8

      - name: Publish release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with: &release-options
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Windows ${{ env.APP_VERSION }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          # El manifiesto solo se carga despues de completar el instalador.
          preserve_order: true
          files: |
            build/installer/DicsaOperacionSetup.exe
            build/installer/version.json

      - name: Wait before retrying release
        if: steps.publish.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 15

      - name: Retry publish release
        id: publish-retry
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with: *release-options

      - name: Preserve installer after publish failure
        if: failure() && steps.publish-retry.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-${{ env.APP_VERSION }}-${{ github.run_attempt }}
          path: |
            build/installer/DicsaOperacionSetup.exe
            build/installer/version.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
