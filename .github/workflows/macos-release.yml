name: macOS Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app version
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          if [ -z "$version" ]; then
            echo "No se encontro la version en pubspec.yaml"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS app
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          mkdir -p build/macos/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/DICSA.app \
            build/macos/artifacts/DICSA-macOS.zip

      - name: Publish release asset
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with: &release-options
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.APP_VERSION }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            build/macos/artifacts/DICSA-macOS.zip

      - name: Wait before retrying release
        if: steps.publish.outcome == 'failure'
        run: sleep 15

      - name: Retry publish release asset
        id: publish-retry
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with: *release-options

      - name: Preserve macOS package after publish failure
        if: failure() && steps.publish-retry.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: macos-release-${{ env.APP_VERSION }}-${{ github.run_attempt }}
          path: build/macos/artifacts/DICSA-macOS.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
