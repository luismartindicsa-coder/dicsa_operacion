name: macOS Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app version
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          if [ -z "$version" ]; then
            echo "No se encontro la version en pubspec.yaml"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release --no-codesign

      - name: Package macOS app
        run: |
          mkdir -p build/macos/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/DICSA.app \
            build/macos/artifacts/DICSA-macOS.zip

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.APP_VERSION }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            build/macos/artifacts/DICSA-macOS.zip
